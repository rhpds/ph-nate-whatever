# Publishing House — Project Spec
# Lifecycle: intake → content_review → infra_review → jira_sync → development → ready → published
# No secrets in this file. Tokens live in ~/.config/publishing-house/auth.json
# Stage is managed by SonataFlow and cached in .ph-state — do not edit stage.current manually.
# NOTE: This file is also in the template repo. The Scaffolder overlays project.* values.
# TODO: Eliminate this copy — Scaffolder should pull from template repo directly.

project:
  slug: "ph-nate-whatever"
  owner_email: "nstephan@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp-published"
  initiative_key: "none"
  showroom_type: "classic"
  intake_type: "new"
  automation_type: ""               # ansible | gitops | both - captured in intake Phase 5, not from template
  description: "whatever"
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-2104"
  workflow_id: "ea6b905b-2940-4114-9c66-dee116a87485"

spec:
  title: ""
  learning_objectives: []
  modules: []              # [{id, title, duration_min}] — written by intake Phase 4; id is stable (e.g. module-01)
  environment:
    platform: "ocp"               # ocp | rhel-vms — from template
    topology: ""               # shared-cluster | per-student | cnv-pool — captured in intake
    cloud_provider: "aws"   # cnv | aws | rosa | aro — from template
    max_concurrent_users:      # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "4.21"         # e.g. 4.20 — from template
    cluster_type: "sno"       # sno | multinode — from template
    control_plane_instance_count:      # 1 if sno, 3 if multinode
    control_plane_cpu:                 # 32 if sno, 16 if multinode
    control_plane_ram_gb:              # 128 if sno, 64 if multinode
    worker_count:                      # number of OCP worker nodes
    worker_cpu:                        # vCPU per worker
    worker_ram_gb:                     # RAM per worker in GB
    worker_disk_gb:                    # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os, version}
    # RHEL version from template (values.rhel_version) is used by intake skill to populate version field for all VMs
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: ""                 # maas | gpu | none
    ai_model_tier: ""                  # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services: []              # named external service dependencies e.g. [github.com]
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours:
  audience: ""               # beginner | intermediate | advanced

development:
  automation:
  e2e:
    status: not_started
  healthCheck:
    status: not_started

compliance:
  last_hard_check:
  hard_result:

tracking:
  paused: false
  pause_reason:

# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable:
    assessment_strategy: ""
    catalog_gap: ""
    design_overview: ""
    module_summaries: []
    rcars_overlap_pct:
    rcars_top_matches: []
    rejections: []

  infra:
    peak_environments:
    cost_per_run_est: ""
    provisioning_time_est: ""
    agnosticv_base_ci: ""
    approved_by: ""
    rejections: []
